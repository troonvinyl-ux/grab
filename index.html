<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>MyGab TV</title>
<style>
:root{color-scheme:dark;--bg:#080a10;--panel:#141827;--muted:#aab2c4;--accent:#9875ff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:Arial,sans-serif}button,input,textarea{font:inherit}button{background:#252b3c;border:1px solid #414963;border-radius:10px;padding:12px 16px;color:white;cursor:pointer}button:focus,input:focus,textarea:focus{outline:3px solid #bba7ff;outline-offset:2px}.primary{background:var(--accent);border-color:var(--accent)}header{height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #252b3a}.brand{font-weight:900;font-size:24px}.brand span{color:#ba9fff}.muted{color:var(--muted)}main{height:calc(100% - 64px);position:relative}.feed{height:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#25213c,#090b12 65%)}.player{width:min(65vw,520px);height:calc(100% - 28px);max-height:850px;position:relative;border-radius:16px;overflow:hidden;background:#000;border:1px solid #31374a;box-shadow:0 15px 70px #0009}.player iframe,.player video{width:100%;height:100%;border:0;object-fit:contain;background:#000}.overlay{position:absolute;bottom:0;left:0;right:0;padding:48px 18px 18px;background:linear-gradient(transparent,#000d);pointer-events:none}.overlay>*{margin:5px 0}.overlay a{pointer-events:auto;color:#d8cbff}.controls{position:absolute;right:20px;bottom:30px;display:flex;flex-direction:column;gap:12px}.controls button{min-width:58px;min-height:54px;font-size:20px}.feedbar{position:absolute;top:16px;left:20px;display:flex;gap:8px;align-items:center}.notice{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);max-width:80%;text-align:center;color:var(--muted)}.modal{position:absolute;inset:0;background:#05060bed;display:flex;align-items:center;justify-content:center;padding:22px;z-index:5}.card{width:min(720px,96vw);max-height:92%;overflow:auto;background:var(--panel);border:1px solid #333b51;border-radius:18px;padding:24px}.card h2{margin-top:0}.field{display:grid;gap:8px;margin:14px 0}.field input,.field textarea{width:100%;background:#090c14;border:1px solid #3c455e;border-radius:9px;color:#fff;padding:12px}.field textarea{min-height:90px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.small{font-size:13px;line-height:1.5}.hidden{display:none!important}.feedlist{display:grid;gap:8px}.feeditem{padding:12px;border:1px solid #353c50;border-radius:10px;display:flex;justify-content:space-between;gap:12px}a{color:#cbbaff}
@media(max-width:700px){.player{width:88vw;height:calc(100% - 24px)}.controls{right:10px;bottom:18px}.feedbar{left:10px;top:10px}header{padding:0 12px}}
</style></head><body>
<header><div class="brand">MyGab<span> TV</span></div><div class="row" style="flex:initial;align-items:center"><span class="muted" id="count">Demo feed</span><button id="adminOpen">Admin 🔒</button></div></header>
<main><section class="feed" id="feed"><div class="feedbar"><button id="prev">◀ Previous</button><button id="next" class="primary">Next ▶</button></div><div class="player" id="player"><div class="notice" id="placeholder">Welcome to MyGab TV<br><br>Open Admin to add search keywords and sources, or load the demonstration feed.</div></div><div class="controls"><button id="up" title="Previous">▲</button><button id="down" title="Next">▼</button><button id="openSource" title="Open source">↗</button></div></section>
<div id="modal" class="modal hidden"><div class="card" id="modalCard"></div></div></main>
<script>
const $=id=>document.getElementById(id);
const KEY='mygab-tv-config-v1';
const defaults={keywords:[],sources:[],items:[],scrapeUrls:[],scraperEndpoint:''};
let config;try{config=JSON.parse(localStorage.getItem(KEY))||JSON.parse(JSON.stringify(defaults))}catch(e){config=JSON.parse(JSON.stringify(defaults))}
config.keywords=Array.isArray(config.keywords)?config.keywords:[];config.sources=Array.isArray(config.sources)?config.sources:[];config.items=Array.isArray(config.items)?config.items:[];config.scrapeUrls=Array.isArray(config.scrapeUrls)?config.scrapeUrls:[];config.scraperEndpoint=typeof config.scraperEndpoint==='string'?config.scraperEndpoint:'';
const isBlockedHost=host=>String(host||'').toLowerCase().includes('youtube')||String(host||'').toLowerCase().endsWith('youtu.be');
const domainList=()=>config.sources.map(x=>String(x).trim().toLowerCase().replace('https://','').replace('http://','').split('/')[0]).filter(Boolean);
function isApprovedUrl(value){try{const u=new URL(value);if(!['http:','https:'].includes(u.protocol)||isBlockedHost(u.hostname))return false;const host=u.hostname.toLowerCase().replace('www.','');return domainList().some(d=>host===d.replace('www.','')||host.endsWith('.'+d.replace('www.','')))}catch(e){return false}}
config.items=config.items.filter(it=>it&&it.url&&isApprovedUrl(it.url));
let index=0,feedItems=[];const save=()=>localStorage.setItem(KEY,JSON.stringify(config));
function normalise(){feedItems=[...(config.items||[])];}
function embedFor(url,provided){if(provided)return provided;try{const u=new URL(url);if(u.hostname.includes('youtu.be'))return 'https://www.youtube-nocookie.com/embed/'+u.pathname.slice(1)+'?autoplay=1&rel=0';if(u.hostname.includes('youtube.com')){const id=u.searchParams.get('v');if(id)return 'https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&rel=0';if(u.pathname.startsWith('/shorts/'))return 'https://www.youtube-nocookie.com/embed/'+u.pathname.split('/')[2]+'?autoplay=1&rel=0';}if(u.hostname.includes('vimeo.com')&&/^\\d+$/.test(u.pathname.slice(1)))return 'https://player.vimeo.com/video/'+u.pathname.slice(1)+'?autoplay=1';}catch(e){}return url;}
function render(){if(!feedItems.length){$('player').innerHTML='<div class="notice">No videos in feed yet.<br><br>Open Admin to configure keywords and add video links.</div>';$('count').textContent='0 videos';return}
index=(index+feedItems.length)%feedItems.length;const item=feedItems[index];$('player').innerHTML='<iframe allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" src="'+esc(item.embed||item.url)+'" title="'+esc(item.title)+'"></iframe><div class="overlay"><strong>'+esc(item.title)+'</strong><div class="small muted">'+(item.keyword?'Found for: '+esc(item.keyword):'Video source')+'</div><a href="'+esc(item.url)+'" target="_blank" rel="noopener">Open original video ↗</a></div>';$('count').textContent=(index+1)+' / '+feedItems.length}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function move(delta){if(!feedItems.length)return;index=(index+delta+feedItems.length)%feedItems.length;render()}
$('prev').onclick=$('up').onclick=()=>move(-1);$('next').onclick=$('down').onclick=()=>move(1);$('openSource').onclick=()=>{if(feedItems[index])window.open(feedItems[index].url,'_blank','noopener')};
let touchY=null;document.addEventListener('touchstart',e=>{touchY=e.changedTouches[0].screenY},{passive:true});document.addEventListener('touchend',e=>{if(touchY===null)return;const dy=e.changedTouches[0].screenY-touchY;if(Math.abs(dy)>70)move(dy<0?1:-1);touchY=null},{passive:true});document.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>25)move(e.deltaY>0?1:-1)},{passive:true});document.addEventListener('keydown',e=>{if(!$('modal').classList.contains('hidden')){if(e.key==='Escape')closeModal();return}if(['ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();move(1)}if(['ArrowUp','PageUp'].includes(e.key)){e.preventDefault();move(-1)}if(e.key==='Enter'){e.preventDefault();move(1)}if(e.key.toLowerCase()==='a')admin()} );
function showModal(html){$('modalCard').innerHTML=html;$('modal').classList.remove('hidden');const f=$('modalCard').querySelector('input,button');if(f)f.focus()}
function closeModal(){$('modal').classList.add('hidden')}
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});
function admin(){if(sessionStorage.getItem('mygab-tv-admin-unlocked')==='1'){adminPanel();return}showModal('<h2>Admin PIN</h2><p class="muted">Enter your PIN to edit discovery settings and the video feed.</p><form id="pinForm"><div class="field"><label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off" autofocus></div><div class="row"><button type="button" id="cancel">Cancel</button><button class="primary" type="submit">Unlock</button></div><p class="small muted">PIN protection in this standalone prototype is local to this browser. For a public hosted deployment, move admin authentication and settings to a server.</p></form>');$('cancel').onclick=closeModal;$('pinForm').onsubmit=e=>{e.preventDefault();if($('pin').value==='1802'){sessionStorage.setItem('mygab-tv-admin-unlocked','1');adminPanel()}else{$('pin').value='';alert('Incorrect PIN')}}}
$('adminOpen').onclick=admin;
function adminPanel(){showModal('<h2>MyGab TV · Admin</h2><p class="muted small">Configure what to search for and manage links in the feed. Settings save in this browser.</p><div class="field"><label for="keywords">Search keywords (one per line)</label><textarea id="keywords">'+esc((config.keywords||[]).join('\n'))+'</textarea></div><div class="field"><label for="sources">Approved adults-only website domains (one per line)</label><textarea id="sources" placeholder="Enter only websites you know are adults-only">'+esc((config.sources||[]).join('\n'))+'</textarea><p class="small muted">Only approved domains can be scanned or added. YouTube is blocked. The app cannot verify a site&#39;s age rating or every video&#39;s content automatically. Approve only adult-only sites you trust, and review imported results before playback. Potential under-18/minor-related titles and URLs are filtered, but automated filtering is not a guarantee.</p></div><h3>Discover videos by keyword</h3><p class="small muted">Use the links below to search each approved domain for your saved keywords. Search results open in a new browser tab; add the chosen public page URL to the scanner above.</p><div id="keywordSearches" class="feedlist"></div><h3>Scrape videos from URLs</h3><p class="small muted">For better compatibility, configure your separately deployed MyGab scraper API endpoint below. The backend must be deployed and its approved-domain list configured first. Without it, the browser uses the basic text-reader fallback.</p><div class="field"><label for="scraperEndpoint">Scraper API base URL (optional)</label><input id="scraperEndpoint" placeholder="https://your-worker.workers.dev"></div><div class="field"><label for="scrapeUrls">Page URLs to scan</label><textarea id="scrapeUrls" placeholder="https://approved-adult-site.example/videos"></textarea></div><div class="row"><button id="scrapeNow" class="primary">Scan URLs for videos</button><button id="saveScrapeUrls">Save source URLs</button></div><p id="scrapeStatus" class="small muted" aria-live="polite"></p><p class="small muted">On Fire Stick, enter the base URL of your deployed Worker (without /scan). The app sends each URL to its /scan endpoint. The Worker and its ALLOWED_DOMAINS setting must be configured separately; this field does not deploy the backend.</p><h3>Add a video manually</h3><div class="field"><label for="title">Title</label><input id="title" placeholder="Video title"></div><div class="field"><label for="url">Original video URL</label><input id="url" placeholder="https://approved-adult-site.example/video/123"></div><div class="field"><label for="embed">Embed URL (optional; approved-site player URL)</label><input id="embed" placeholder="https://approved-adult-site.example/embed/123"></div><div class="row"><button id="addVideo" class="primary">Add video</button><button id="saveConfig">Save keywords & websites</button><button id="resetDemo">Clear feed</button></div><h3>Feed videos</h3><div class="feedlist" id="feedlist"></div><p class="small muted">Keyword discovery UI is ready, but automated internet-wide search is not active until a server-side search provider/API is configured. This avoids broken or unauthorised scraping and lets Fire Stick playback use each source’s supported player.</p><div class="row"><button id="closeAdmin">Done</button></div>');
const drawSearches=()=>{$('keywordSearches').innerHTML=(config.keywords||[]).map(k=>'<div class="feeditem"><div><strong>'+esc(k)+'</strong><div class="small muted">Search this keyword on an approved site:</div>'+domainList().map(d=>'<div><a href="https://www.google.com/search?q='+encodeURIComponent('site:'+d+' '+k)+'" target="_blank" rel="noopener">Search '+esc(d)+' ↗</a></div>').join('')+'</div></div>').join('')||'<p class="muted">Add keywords above and save settings to see search links here.</p>'};drawSearches();$('scrapeUrls').value=(config.scrapeUrls||[]).join('\n');$('scraperEndpoint').value=config.scraperEndpoint||'';const drawList=()=>{$('feedlist').innerHTML=(config.items||[]).map((it,i)=>'<div class="feeditem"><div><strong>'+esc(it.title)+'</strong><div class="small muted">'+esc(it.url)+'</div></div><button data-remove="'+i+'">Remove</button></div>').join('')||'<p class="muted">No added videos.</p>';document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{config.items.splice(+b.dataset.remove,1);save();drawList();normalise();render()})};
$('saveConfig').onclick=()=>{config.keywords=$('keywords').value.split('\n').map(s=>s.trim()).filter(Boolean);config.sources=$('sources').value.split('\n').map(s=>s.trim().toLowerCase().replace('https://','').replace('http://','').split('/')[0]).filter(Boolean);if(config.sources.some(d=>d.includes('youtube')||d.includes('youtu.be')||d.includes(' ')||!d.includes('.'))){alert('Enter valid adult-only domain names. YouTube domains are not allowed.');return}save();drawSearches();alert('Keywords and approved websites saved on this device.');};
function safeHttpUrl(value){try{const u=new URL(value);return ['http:','https:'].includes(u.protocol)&&!isBlockedHost(u.hostname)?u.href:null}catch(e){return null}}
function extractVideoLinks(text,baseUrl){
 const found=new Map();
 const blockedContent=/(underage|under-age|minor|child|children|schoolgirl|schoolboy|teen(?:ager)?|barely[\s_-]*legal|young[\s_-]*girl)/i;
 const add=(raw,title='Video from scanned page',forceEmbed=false)=>{let url;try{url=new URL(raw,baseUrl).href}catch(e){return}if(!safeHttpUrl(url))return;
 const u=new URL(url);if(blockedContent.test((title||'')+' '+u.pathname+' '+u.search))return;
 let embed=null,cleanUrl=u.href;
 if(/\.(mp4|webm|ogg|m3u8)(?:$|[?#])/i.test(u.href)){embed=u.href}
 else if(/\/(?:embed|player|video|videos|watch)\/[a-z0-9_-]{4,}/i.test(u.pathname)||/[?&](?:video|video_id|id)=([a-z0-9_-]{4,})/i.test(u.search)||forceEmbed){embed=u.href}
 if(embed&&!found.has(cleanUrl))found.set(cleanUrl,{title:(title||'Video from scanned page').slice(0,180),url:cleanUrl,embed});
 };
 const md=/\[([^\]]{1,180})\]\((https?:\/\/[^\s)]+)\)/gi;let m;while((m=md.exec(text))!==null)add(m[2],m[1]);
 const htmlVideo=/<(?:video|source|iframe)[^>]+(?:src|data-src)=["']([^"']+)["'][^>]*>/gi;while((m=htmlVideo.exec(text))!==null)add(m[1],'Embedded video',true);
 const jsonLd=/"(?:contentUrl|embedUrl|url)"\s*:\s*"([^"]+)"/gi;while((m=jsonLd.exec(text))!==null)add(m[1],'Video from page metadata',true);
 const urls=text.match(/https?:\/\/[^\s"'<>\\]+/gi)||[];for(const u of urls)add(u);
 return [...found.values()];
}
$('saveScrapeUrls').onclick=()=>{const urls=$('scrapeUrls').value.split('\n').map(s=>s.trim()).filter(Boolean);if(urls.some(s=>!safeHttpUrl(s))){$('scrapeStatus').textContent='Only valid http:// and https:// URLs can be saved.';return}const endpoint=$('scraperEndpoint').value.trim().replace(/\/+$/,'');if(endpoint&&!/^https:\/\//i.test(endpoint)){ $('scrapeStatus').textContent='Scraper API endpoint must use HTTPS.';return}config.scrapeUrls=urls;config.scraperEndpoint=endpoint;save();$('scrapeStatus').textContent='Saved '+urls.length+' source URL(s) and scraper endpoint.';};
$('scrapeNow').onclick=async()=>{const raw=$('scrapeUrls').value.split('\n').map(s=>s.trim()).filter(Boolean);const urls=raw.map(s=>safeHttpUrl(s));if(!raw.length){$('scrapeStatus').textContent='Enter at least one public URL first.';return}if(urls.some(u=>!u)){$('scrapeStatus').textContent='One or more URLs are invalid. Only http:// and https:// URLs are accepted.';return}
 $('scrapeNow').disabled=true;$('scrapeStatus').textContent='Scanning '+urls.length+' URL(s)…';let all=[],errors=[];const endpoint=$('scraperEndpoint').value.trim().replace(/\/+$/,'');if(endpoint&&!/^https:\/\//i.test(endpoint)){$('scrapeNow').disabled=false;$('scrapeStatus').textContent='Scraper API endpoint must use HTTPS.';return}config.scraperEndpoint=endpoint;
 for(const url of urls){try{if(!isApprovedUrl(url))throw new Error('domain is not in the approved adults-only website list');if(endpoint){const api=new URL(endpoint+'/scan');api.searchParams.set('url',url);const response=await fetch(api.href,{headers:{'Accept':'application/json'}});const data=await response.json().catch(()=>({}));if(!response.ok||data.ok!==true)throw new Error(data.error||('scraper API returned '+response.status));const items=Array.isArray(data.items)?data.items:[];all.push(...items.filter(it=>it&&it.url&&isApprovedUrl(it.url)&&!/(underage|under-age|\\bminor\\b|\\bchildren?\\b|schoolgirl|schoolboy|teen(?:ager)?|barely[\\s_-]*legal|young[\\s_-]*girl)/i.test(String(it.title||'')+' '+String(it.url))));}else{const response=await fetch('https://r.jina.ai/'+url,{headers:{'Accept':'text/plain'}});if(!response.ok)throw new Error('reader returned '+response.status);const body=await response.text();all.push(...extractVideoLinks(body,url).filter(it=>isApprovedUrl(it.url)))}}catch(err){errors.push(new URL(url).hostname+': '+String(err.message||err))}}
 const existing=new Set((config.items||[]).map(x=>x.url));const fresh=all.filter(x=>!existing.has(x.url));config.items=[...(config.items||[]),...fresh];config.scrapeUrls=urls;save();normalise();drawList();render();$('scrapeNow').disabled=false;$('scrapeStatus').textContent='Found '+all.length+' supported video link(s); added '+fresh.length+' new video(s).'+(errors.length?' Some pages could not be read: '+errors.join('; '):'');
};
$('addVideo').onclick=()=>{const url=$('url').value.trim(),title=$('title').value.trim()||url,embed=embedFor(url,$('embed').value.trim());if(!/^https?:\/\//i.test(url)||!/^https?:\/\//i.test(embed)){alert('Enter valid http(s) video and embed URLs.');return}if(!isApprovedUrl(url)){alert('Blocked. Add this adults-only domain to Approved websites and save first. YouTube is not allowed.');return}config.items=config.items||[];config.items.push({title,url,embed});save();normalise();drawList();render();$('title').value=$('url').value=$('embed').value='';};
$('resetDemo').onclick=()=>{config.items=[];save();normalise();drawList();render()};
$('closeAdmin').onclick=()=>{closeModal();normalise();render()};drawList()}
normalise();render();
</script></body></html>
